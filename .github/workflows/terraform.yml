# =============================================================================
# Reusable Terraform Deployment Workflow
# -----------------------------------------------------------------------------
# Owned and maintained by the platform team.
# This workflow is called by team repositories using workflow_call.
# It should not be triggered directly.
#
# What this workflow does:
#   1. Validates Terraform code
#   2. Runs Checkov security scanning
#   3. Runs Infracost cost analysis
#   4. Plans the Terraform changes
#   5. Waits for manual approval before applying
#   6. Applies the Terraform changes
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      # The target deployment environment (dev, uat, prod)
      environment:
        description: "Target deployment environment"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - uat
          - prod

      # The Azure region to deploy into
      region:
        description: "Azure region to deploy into"
        required: true
        type: choice
        default: uksouth
        options:
          - uksouth
          - ukwest
          - westeurope

      # The Terraform working directory within the repository
      working_directory:
        description: "Terraform working directory"
        required: false
        type: string
        default: "."

  workflow_call:
    inputs:
      # The target deployment environment (dev, uat, prod)
      environment:
        required: true
        type: string

      # The Azure region to deploy into
      region:
        required: true
        type: string

      # The Terraform working directory within the calling repository
      working_directory:
        required: false
        type: string
        default: "."
    secrets:
      # Azure federated identity credentials - no client secret required
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      # Terraform state backend configuration
      TFSTATE_RESOURCE_GROUP:
        required: true
      TFSTATE_STORAGE_ACCOUNT:
        required: true
      TFSTATE_CONTAINER_NAME:
        required: true
      #Infracost API key - stored at org level, passed through from caller
      INFRACOST_API_KEY:
        required: true

permissions:
    id-token: write # Required for Azure OIDC authentication
    contents: read # Required to checkout code and upload Checkov results

# Concurrency control - prevents parallel deployments to the same environment.
# If a deployment is already running for this environment, the new run will
# queue and wait rather than running simultaneously.
# cancel-in-progress is false to prevent cancelling a running Terraform apply.
concurrency:
  group: terraform-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Validate
  # Runs Terraform validate to check the configuration is syntactically correct
  # ---------------------------------------------------------------------------
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    # environment: ${{ inputs.environment }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6.0.2
      
      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: latest

      # Authenticate to Azure using federated identity (OIDC)
      # No client secret is required - the token is issued at runtime
      - name: Azure Login
        uses: Azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Terraform Init
        working-directory: terraform
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER_NAME }}" \
            -backend-config="key=azure-pipeline.tfstate"
#${{ inputs.environment }}-${{ inputs.region }}.tfstate"

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

  # ---------------------------------------------------------------------------
